app = "docsign-bettersign-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PARSE_MOUNT = "/app"
  USE_LOCAL = "TRUE"
  PORT = "8080"
  # The seal (utils/seal.js). SEAL_BACKEND is unset (the PFX) until the
  # rollout in docs/BsServiceIdentitySealing.md §5; BS_SERVICE_IDENTITY_TOKEN
  # is a secret (the service's BS_SERVICE_TOKEN).
  BS_SERVICE_IDENTITY_URL = "http://bs-service-identity.internal:8789"
  # "Sign in with BetterSign" through bs-id (cloud/parsefunction/bsidlogin.js).
  BS_ID_URL = "https://id.bettersign.ing"
  BS_ID_CLIENT_ID = "bs-opensign"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/"

[mounts]
  source = "opensign_files"
  destination = "/usr/src/app/files"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
